id: "pv-03"
source: "考前预测题·第3讲"
lesson: 3
knowledge:
  - 特征值
  - Jordan标准形
  - 几何重数
  - 最小多项式
  - 对角化
problem: |
  设 A=\begin{pmatrix}2&1&0\\0&2&0\\1&0&3\end{pmatrix}

  (1) 求 A 的所有特征值，以及每个特征值的代数重数和几何重数；
  (2) 判断 A 是否可对角化，并求出 A 的 Jordan 标准形 J；
  (3) 求可逆矩阵 P 使得 P^{-1}AP=J；
  (4) 求 A 的最小多项式 m_A(\lambda)。
steps:
  - title: "(1) 特征值与重数"
    content: |
      计算特征多项式：
      \det(A-\lambda I)=\begin{vmatrix}2-\lambda&1&0\\0&2-\lambda&0\\1&0&3-\lambda\end{vmatrix}

      按第一行展开（或三阶行列式直接计算）：
      = (2-\lambda)\begin{vmatrix}2-\lambda&0\\1&3-\lambda\end{vmatrix} - 1\cdot\begin{vmatrix}0&0\\1&3-\lambda\end{vmatrix} + 0
      = (2-\lambda)[(2-\lambda)(3-\lambda)-0] - 0 = (2-\lambda)^2(3-\lambda)

      特征值：\lambda_1=\lambda_2=2（代数重数 2），\lambda_3=3（代数重数 1）。

      对 \lambda=2，求几何重数 g(2)：
      A-2I=\begin{pmatrix}0&1&0\\0&0&0\\1&0&1\end{pmatrix}

      行变换：交换 R_1\leftrightarrow R_3→\begin{pmatrix}1&0&1\\0&0&0\\0&1&0\end{pmatrix}→\begin{pmatrix}1&0&1\\0&1&0\\0&0&0\end{pmatrix}

      r(A-2I)=2，故 g(2)=3-2=1<2=a(2)（几何重数小于代数重数）。
      因此 \lambda=2 对应一个 2 阶 Jordan 块。

      对 \lambda=3，g(3)=3-r(A-3I)=3-2=1=a(3)，对应 1 阶 Jordan 块。

  - title: "(2) 可对角化判定与 J"
    content: |
      由于 g(2)=1<2=a(2)，A 不可对角化。

      Jordan 标准形为：
      J=\begin{pmatrix}2&1&0\\0&2&0\\0&0&3\end{pmatrix}= \operatorname{diag}(J_2(2),(3))

      其中 J_2(2)=\begin{pmatrix}2&1\\0&2\end{pmatrix}。

  - title: "(3) 求变换矩阵 P"
    content: |
      \textbf{对 \lambda=2：}解 (A-2I)\eta_1=0：
      \begin{pmatrix}0&1&0\\0&0&0\\1&0&1\end{pmatrix}\begin{pmatrix}x_1\\x_2\\x_3\end{pmatrix}=0\implies\begin{cases}x_2=0\\x_1+x_3=0\end{cases}
      取 \eta_1=(1,0,-1)^T。

      求广义特征向量：解 (A-2I)\eta_2=\eta_1：
      \begin{pmatrix}0&1&0\\0&0&0\\1&0&1\end{pmatrix}\begin{pmatrix}x_1\\x_2\\x_3\end{pmatrix}=\begin{pmatrix}1\\0\\-1\end{pmatrix}\implies\begin{cases}x_2=1\\x_1+x_3=-1\end{cases}
      取 \eta_2=(0,1,-1)^T。

      \textbf{对 \lambda=3：}解 (A-3I)\eta_3=0：
      \begin{pmatrix}-1&1&0\\0&-1&0\\1&0&0\end{pmatrix}\eta_3=0\implies\begin{cases}-x_1+x_2=0\\-x_2=0\end{cases}
      故 x_1=x_2=0，x_3 自由。取 \eta_3=(0,0,1)^T。

      因此 P=[\eta_1,\eta_2,\eta_3]=\begin{pmatrix}1&0&0\\0&1&0\\-1&-1&1\end{pmatrix}。

  - title: "(4) 最小多项式"
    content: |
      各 Jordan 块对应的初等因子：
      J_2(2) 对应 (\lambda-2)^2，J_1(3) 对应 (\lambda-3)。

      最小多项式为各初等因子的最小公倍式：
      m_A(\lambda)=(\lambda-2)^2(\lambda-3)

      验证：m_A(A)=(A-2I)^2(A-3I)=0。
