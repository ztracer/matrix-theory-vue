id: "hw-024"
source: "教材习题p48-3"
lesson: 4
type: "homework"
knowledge:
  - 矩阵指数
  - 导数
  - 幂级数
  - 微分方程
problem: |
  求微分方程组 \dfrac{d\xi_1}{dt}=-2\xi_1+\xi_2+1，\dfrac{d\xi_2}{dt}=-4\xi_1+2\xi_2+2，\dfrac{d\xi_3}{dt}=\xi_1+\xi_3+e^t-1，满足初始条件 \xi_1(0)=1,\xi_2(0)=1,\xi_3(0)=-1 的解。
steps:
  - title: '方法一：矩阵指数 + 常数变易法（力大砖飞）'
    content: |
      令 \xi(t)=\begin{pmatrix}\xi_1(t)\\ \xi_2(t)\\ \xi_3(t)\end{pmatrix}，则原方程组可以写成 \dfrac{d\xi}{dt}=A\xi+f(t)，其中：
      \begin{aligned}
      A&=\begin{pmatrix}-2&1&0\\-4&2&0\\1&0&1\end{pmatrix},\\
      f(t)&=\begin{pmatrix}1\\2\\e^t-1\end{pmatrix},\\
      \xi(0)&=\begin{pmatrix}1\\1\\-1\end{pmatrix}.
      \end{aligned}

      先求 A 的特征多项式：
      \begin{aligned}
      \det(\lambda I-A)
      &=
      \begin{vmatrix}
      \lambda+2&-1&0\\
      4&\lambda-2&0\\
      -1&0&\lambda-1
      \end{vmatrix}\\
      &=
      (\lambda-1)\begin{vmatrix}\lambda+2&-1\\4&\lambda-2\end{vmatrix}
      =(\lambda-1)\lambda^2.
      \end{aligned}

      所以特征值为 \lambda_1=1, \lambda_2=\lambda_3=0。

      对 \lambda=1，可取特征向量 v_1=\begin{pmatrix}0\\0\\1\end{pmatrix}。

      对 \lambda=0，可取特征向量 v_2=\begin{pmatrix}1\\2\\-1\end{pmatrix}。

      因为 \lambda=0 的几何重数为 1，还需要找广义特征向量 v_3，使 Av_3=v_2。可取 v_3=\begin{pmatrix}0\\1\\-1\end{pmatrix}。

      令 P=(v_1,v_2,v_3)，则 A 可化为 Jordan 形。由此可得：
      e^{tA}=\begin{pmatrix}1-2t&t&0\\-4t&1+2t&0\\1+2t-e^t&e^t-t-1&e^t\end{pmatrix}

      验证：e^{0A}=I，且 \left.\frac{d}{dt}e^{tA}\right|_{t=0}=A。

      对非齐次常系数方程组，常数变易公式为 \xi(t)=e^{tA}\xi(0)+\int_0^t e^{(t-s)A}f(s)\,ds。

      先计算 e^{tA}\xi(0)：
      e^{tA}\begin{pmatrix}1\\1\\-1\end{pmatrix}=\begin{pmatrix}1-t\\1-2t\\t-e^t\end{pmatrix}

      再计算积分项。把 e^{(t-s)A} 与 f(s)=\begin{pmatrix}1\\2\\e^s-1\end{pmatrix} 相乘，三个分量会化简为与 s 无关的向量：
      e^{(t-s)A}f(s)=\begin{pmatrix}1\\2\\e^t-1\end{pmatrix}

      因此 \int_0^t e^{(t-s)A}f(s)\,ds=\begin{pmatrix}t\\2t\\t(e^t-1)\end{pmatrix}。

      合并：
      \begin{aligned}
      \xi(t)
      &=
      \begin{pmatrix}1-t\\1-2t\\t-e^t\end{pmatrix}
      +
      \begin{pmatrix}t\\2t\\t(e^t-1)\end{pmatrix}\\
      &=
      \begin{pmatrix}1\\1\\(t-1)e^t\end{pmatrix}.
      \end{aligned}

      这就是“力大砖飞”的做法：矩阵指数一旦算准，后面直接套公式。
  - title: '方法二：观察解耦法（巧妙）'
    content: |
      观察前两个方程：
      \begin{aligned}
      \frac{d\xi_1}{dt}&=-2\xi_1+\xi_2+1,\\
      \frac{d\xi_2}{dt}&=-4\xi_1+2\xi_2+2.
      \end{aligned}

      第二个方程右端正好是第一个方程右端的 2 倍：-4\xi_1+2\xi_2+2=2(-2\xi_1+\xi_2+1)。

      所以 \dfrac{d\xi_2}{dt}=2\dfrac{d\xi_1}{dt}。

      积分得 \xi_2=2\xi_1+C。

      代入初值 \xi_1(0)=1,\xi_2(0)=1，得 1=2\cdot 1+C。

      因此 C=-1，即 \xi_2=2\xi_1-1。

      把它代回第一个方程：
      \frac{d\xi_1}{dt}=-2\xi_1+(2\xi_1-1)+1=0

      所以 \xi_1(t) 是常数。由 \xi_1(0)=1，得 \xi_1(t)=1。

      于是 \xi_2(t)=2\cdot 1-1=1。

      再代入第三个方程：
      \frac{d\xi_3}{dt}=\xi_1+\xi_3+e^t-1=1+\xi_3+e^t-1=\xi_3+e^t

      即 \xi_3'-\xi_3=e^t。

      这个一阶方程也可以用常数变易法。令 \xi_3=C(t)e^t，则 \xi_3'=C'(t)e^t+C(t)e^t。代入 \xi_3'-\xi_3=e^t，得 C'(t)=1。

      因此 C(t)=t+C，再由初值 \xi_3(0)=-1，得 C=-1，于是 \xi_3(t)=(t-1)e^t。

      等价地，也可以写成积分因子法：
      \begin{aligned}
      e^{-t}\xi_3'-e^{-t}\xi_3&=1,\\
      \frac{d}{dt}(e^{-t}\xi_3)&=1.
      \end{aligned}

      积分后同样得到 e^{-t}\xi_3=t+C，所以 \xi_3=(t+C)e^t，代入初值后仍为 \xi_3(t)=(t-1)e^t。

      两种方法得到同一个结果：
      \boxed{\xi_1(t)=1,\quad \xi_2(t)=1,\quad \xi_3(t)=(t-1)e^t}

      \textbf{验证}：
      - \xi_1=1, \xi_1'=0，右边 -2+1+1=0 ✓
      - \xi_2=1, \xi_2'=0，右边 -4+2+2=0 ✓
      - \xi_3=(t-1)e^t, \xi_3'=te^t，右边 1+(t-1)e^t+e^t-1=te^t ✓
      - 初始条件：\xi(0)=(1,1,-1)^T ✓

      做这类题时，可以先观察方程之间是否有比例关系；若看不出来，再使用矩阵指数和常数变易公式。
