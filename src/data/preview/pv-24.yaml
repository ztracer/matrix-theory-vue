id: "pv-24"
source: "考前预测题·第5-7讲融合"
lesson: 5
knowledge:
  - LDU分解
  - SVD
  - 奇异值
  - Moore-Penrose逆
  - 广义逆
  - Penrose方程
problem: |
  设 A=\begin{pmatrix}1&1&0\\1&0&1\end{pmatrix}。

  (1) 求 A 的 LDU 分解 A=LDU，其中 L 为单位下三角矩阵，D 为对角矩阵，U 为单位上三角矩阵；
  (2) 求 A 的奇异值分解 A=U\Sigma V^{\mathsf{T}}（仅需求出 \Sigma 和一个有效的 U,V）；
  (3) 利用 SVD 构造 A 的 M-P 广义逆：A^+=V\Sigma^+U^{\mathsf{T}}，并验证 Penrose 条件 AA^+A=A。
steps:
  - title: "(1) LDU 分解"
    content: |
      对 A=\begin{pmatrix}1&1&0\\1&0&1\end{pmatrix} 进行消元：

      第二行减去第一行（乘子 \ell_{21}=1）：
      \begin{pmatrix}1&1&0\\0&-1&1\end{pmatrix}

      此时上三角部分为 U_0=\begin{pmatrix}1&1&0\\0&-1&1\end{pmatrix}。提取主对角线：
      D=\begin{pmatrix}1&0\\0&-1\end{pmatrix}

      将 U_0 各行除以对应的 D 对角元得到单位上三角矩阵 U：
      U=\begin{pmatrix}1&1&0\\0&1&-1\end{pmatrix}

      消元乘子构成 L：L=\begin{pmatrix}1&0\\1&1\end{pmatrix}（单位下三角）。

      验证：
      LDU=\begin{pmatrix}1&0\\1&1\end{pmatrix}\begin{pmatrix}1&0\\0&-1\end{pmatrix}\begin{pmatrix}1&1&0\\0&1&-1\end{pmatrix}
      =\begin{pmatrix}1&0\\1&1\end{pmatrix}\begin{pmatrix}1&1&0\\0&-1&1\end{pmatrix}
      =\begin{pmatrix}1&1&0\\1&0&1\end{pmatrix}=A \checkmark

  - title: "(2) 奇异值分解"
    content: |
      求 A^{\mathsf{T}}A=\begin{pmatrix}1&1\\1&0\\0&1\end{pmatrix}\begin{pmatrix}1&1&0\\1&0&1\end{pmatrix}
      =\begin{pmatrix}2&1&1\\1&1&0\\1&0&1\end{pmatrix}

      特征多项式：
      \det(A^{\mathsf{T}}A-\lambda I)=\begin{vmatrix}2-\lambda&1&1\\1&1-\lambda&0\\1&0&1-\lambda\end{vmatrix}
      =(2-\lambda)(1-\lambda)^2-1\cdot(1-\lambda)-1\cdot(-(1-\lambda))
      =(1-\lambda)[(2-\lambda)(1-\lambda)-2]=(1-\lambda)(\lambda^2-3\lambda)=-\lambda(\lambda-1)(\lambda-3)

      特征值：\lambda_1=3,\;\lambda_2=1,\;\lambda_3=0。奇异值：\sigma_1=\sqrt{3},\;\sigma_2=1,\;\sigma_3=0。

      \textbf{右奇异向量（A^{\mathsf{T}}A 的特征向量）：}
      \lambda_1=3：解 (A^{\mathsf{T}}A-3I)v_1=0，得 v_1=\dfrac{1}{\sqrt{6}}(2,1,1)^{\mathsf{T}}
      \lambda_2=1：解 (A^{\mathsf{T}}A-I)v_2=0，得 v_2=\dfrac{1}{\sqrt{2}}(0,1,-1)^{\mathsf{T}}
      \lambda_3=0：解 A^{\mathsf{T}}Av_3=0，得 v_3=\dfrac{1}{\sqrt{3}}(1,-1,-1)^{\mathsf{T}}

      \textbf{左奇异向量：}u_i=Av_i/\sigma_i（i=1,2）。u_3 取与 u_1,u_2 正交的单位向量。
      u_1=\dfrac{Av_1}{\sqrt{3}}=\dfrac{1}{\sqrt{2}}(1,1)^{\mathsf{T}},\quad
      u_2=\dfrac{Av_2}{1}=\dfrac{1}{\sqrt{2}}(1,-1)^{\mathsf{T}}

      SVD：A=U\Sigma V^{\mathsf{T}}，其中
      U=\dfrac{1}{\sqrt{2}}\begin{pmatrix}1&1\\1&-1\end{pmatrix},\;
      \Sigma=\begin{pmatrix}\sqrt{3}&0&0\\0&1&0\end{pmatrix},\;
      V=\begin{pmatrix}\frac{2}{\sqrt{6}}&0&\frac{1}{\sqrt{3}}\\\frac{1}{\sqrt{6}}&\frac{1}{\sqrt{2}}&-\frac{1}{\sqrt{3}}\\\frac{1}{\sqrt{6}}&-\frac{1}{\sqrt{2}}&-\frac{1}{\sqrt{3}}\end{pmatrix}

  - title: "(3) SVD 构造 A⁺ 并验证"
    content: |
      \Sigma^+ 将 \Sigma 的非零奇异值取倒数后转置：
      \Sigma^+=\begin{pmatrix}\frac{1}{\sqrt{3}}&0\\0&1\\0&0\end{pmatrix}

      A^+=V\Sigma^+U^{\mathsf{T}}
      =\begin{pmatrix}\frac{2}{\sqrt{6}}&0&\frac{1}{\sqrt{3}}\\\frac{1}{\sqrt{6}}&\frac{1}{\sqrt{2}}&-\frac{1}{\sqrt{3}}\\\frac{1}{\sqrt{6}}&-\frac{1}{\sqrt{2}}&-\frac{1}{\sqrt{3}}\end{pmatrix}
      \begin{pmatrix}\frac{1}{\sqrt{3}}&0\\0&1\\0&0\end{pmatrix}
      \dfrac{1}{\sqrt{2}}\begin{pmatrix}1&1\\1&-1\end{pmatrix}

      计算得 A^+=\dfrac{1}{3}\begin{pmatrix}1&1\\2&-1\\-1&2\end{pmatrix}
      或等价形式 A^+=\begin{pmatrix}\frac{1}{3}&\frac{1}{3}\\\frac{2}{3}&-\frac{1}{3}\\-\frac{1}{3}&\frac{2}{3}\end{pmatrix}。

      \textbf{验证 AA^+A=A：}
      AA^+=\begin{pmatrix}1&1&0\\1&0&1\end{pmatrix}\cdot A^+=I_2（可验证 A^+ 恰是 A 的右逆）。
      故 AA^+A=I_2A=A \checkmark

      同理可验证其余三个 Penrose 条件：A^+AA^+=A^+,\;(AA^+)^{\mathsf{T}}=AA^+,\;(A^+A)^{\mathsf{T}}=A^+A。

      \textbf{注}：满秩分解法得 A^+ 与 SVD 法得 A^+ 结果相同——这是 M-P 广义逆唯一性的体现。
