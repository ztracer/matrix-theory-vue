id: "pv-13"
source: "考前预测题·第3讲补充"
lesson: 3
knowledge:
  - 实对称矩阵
  - 正交对角化
  - Cayley-Hamilton
  - 矩阵求逆
  - 对角化
problem: |
  设实对称矩阵
  A=\begin{pmatrix}2&1&1\\1&2&1\\1&1&2\end{pmatrix}。

  (1) 求 A 的特征值与对应特征向量；
  (2) 求正交矩阵 Q，使 Q^TAQ=\Lambda；
  (3) 利用 Cayley-Hamilton 定理将 A^{-1} 表示为 A 的多项式；
  (4) 直接计算 A^{-1} 并与 (3) 比较。
steps:
  - title: "(1) 特征值与特征向量"
    content: |
      可写成 A=I+J，其中 J 为所有元素均为 1 的 3 阶矩阵。

      先分析 J。由于 J 的三行完全相同，所以 \operatorname{rank}(J)=1<3，J 不满秩。

      矩阵不满秩意味着 \det J=0，因此特征多项式 p_J(\lambda)=\det(\lambda I-J) 满足 p_J(0)=\det(-J)=0，于是 0 是 J 的特征值。

      0 特征值对应的特征空间就是齐次方程 Jx=0 的解空间，也就是 \ker J。由秩-零化度定理：
      \dim\ker J=3-\operatorname{rank}(J)=2。

      所以 0 的几何重数为 2。又因为代数重数一定大于等于几何重数，0 的代数重数只能是 2 或 3。

      另一方面，\operatorname{tr}(J)=3，矩阵特征值之和等于迹。如果 0 的代数重数为 3，则三个特征值之和为 0，与 \operatorname{tr}(J)=3 矛盾。因此还必须有一个非零特征值，且这个特征值为 3。

      因此 J 的特征值为 3（代数重数 1，对应向量 (1,1,1)^T）和 0（代数重数 2，对应与 (1,1,1)^T 正交的平面）。

      因此 A=I+J 的特征值为
      \lambda_1=4,\quad \lambda_2=1,\quad \lambda_3=1。

      取对应特征向量：
      \lambda=4: u_1=(1,1,1)^T；
      \lambda=1: u_2=(1,-1,0)^T,u_3=(1,1,-2)^T。
      其中 u_2,u_3 都满足坐标和为 0。

  - title: "(2) 正交对角化"
    content: |
      将特征向量单位化：
      q_1=\frac{1}{\sqrt3}(1,1,1)^T,
      q_2=\frac{1}{\sqrt2}(1,-1,0)^T,
      q_3=\frac{1}{\sqrt6}(1,1,-2)^T。

      这三个向量两两正交且长度为 1。令
      Q=(q_1,q_2,q_3)
      =\begin{pmatrix}
      \frac1{\sqrt3}&\frac1{\sqrt2}&\frac1{\sqrt6}\\
      \frac1{\sqrt3}&-\frac1{\sqrt2}&\frac1{\sqrt6}\\
      \frac1{\sqrt3}&0&-\frac2{\sqrt6}
      \end{pmatrix}。

      则 Q^TQ=I，且
      Q^TAQ=\Lambda=\operatorname{diag}(4,1,1)。

  - title: "(3) C-H 定理求 A^{-1}"
    content: |
      特征多项式为
      p(\lambda)=(\lambda-4)(\lambda-1)^2=\lambda^3-6\lambda^2+9\lambda-4。

      由 Cayley-Hamilton 定理：
      A^3-6A^2+9A-4I=0。

      因 \det A=4\neq0，A 可逆。两边左乘 A^{-1}：
      A^2-6A+9I-4A^{-1}=0。

      故
      A^{-1}=\frac14(A^2-6A+9I)。

  - title: "(4) 直接计算并验证"
    content: |
      因 A=I+J，且 J^2=3J。设 A^{-1}=I+cJ，则
      (I+J)(I+cJ)=I+(c+1)J+cJ^2=I+(1+4c)J。

      要使其等于 I，需 1+4c=0，故 c=-\frac14。

      因此
      A^{-1}=I-\frac14J
      =\frac14\begin{pmatrix}3&-1&-1\\-1&3&-1\\-1&-1&3\end{pmatrix}。

      再用 (3) 的公式验证。先计算
      A^2=\begin{pmatrix}2&1&1\\1&2&1\\1&1&2\end{pmatrix}^2
      =\begin{pmatrix}6&5&5\\5&6&5\\5&5&6\end{pmatrix}。

      代入 A^{-1}=\frac14(A^2-6A+9I)，得
      \begin{aligned}
      A^2-6A+9I
      &=\begin{pmatrix}6&5&5\\5&6&5\\5&5&6\end{pmatrix}
      -6\begin{pmatrix}2&1&1\\1&2&1\\1&1&2\end{pmatrix}
      +9\begin{pmatrix}1&0&0\\0&1&0\\0&0&1\end{pmatrix}\\
      &=\begin{pmatrix}6&5&5\\5&6&5\\5&5&6\end{pmatrix}
      +\begin{pmatrix}-12&-6&-6\\-6&-12&-6\\-6&-6&-12\end{pmatrix}
      +\begin{pmatrix}9&0&0\\0&9&0\\0&0&9\end{pmatrix}\\
      &=\begin{pmatrix}3&-1&-1\\-1&3&-1\\-1&-1&3\end{pmatrix}。
      \end{aligned}

      因此
      A^{-1}=\frac14\begin{pmatrix}3&-1&-1\\-1&3&-1\\-1&-1&3\end{pmatrix}，
      与直接计算结果一致，验证完成 \checkmark。
