id: "pv-01"
source: "考前预测题·第1讲"
lesson: 1
knowledge:
  - 线性空间
  - 子空间判定
  - 基与维数
  - 子空间交与和
  - 维数公式
problem: |
  在全体二阶实方阵构成的线性空间 V=\mathbb{R}^{2\times 2} 中，定义子集：

  W_1=\left\{\begin{pmatrix}a&b\\c&d\end{pmatrix}\;\middle|\;a+d=0\right\},\quad
  W_2=\left\{\begin{pmatrix}a&0\\0&d\end{pmatrix}\;\middle|\;a+d=0\right\}

  (1) 证明 W_1 和 W_2 都是 V 的子空间；
  (2) 分别求 W_1 和 W_2 的一组基与维数；
  (3) 求 W_1\cap W_2 和 W_1+W_2，验证维数公式 \dim(W_1+W_2)=\dim(W_1)+\dim(W_2)-\dim(W_1\cap W_2)。
steps:
  - title: "(1) 验证 W_1 为子空间"
    content: |
      \textbf{非空性：} 零矩阵 O=\begin{pmatrix}0&0\\0&0\end{pmatrix} 满足 0+0=0，故 O\in W_1\neq\varnothing。

      \textbf{加法封闭：} 设 A=\begin{pmatrix}a_1&b_1\\c_1&d_1\end{pmatrix},B=\begin{pmatrix}a_2&b_2\\c_2&d_2\end{pmatrix}\in W_1，则 a_1+d_1=0, a_2+d_2=0。
      A+B=\begin{pmatrix}a_1+a_2&b_1+b_2\\c_1+c_2&d_1+d_2\end{pmatrix}， 其迹 (a_1+a_2)+(d_1+d_2)=(a_1+d_1)+(a_2+d_2)=0，故 A+B\in W_1。

      \textbf{数乘封闭：} 任取 k\in\mathbb{R}，kA=\begin{pmatrix}ka_1&kb_1\\kc_1&kd_1\end{pmatrix}，迹为 ka_1+kd_1=k(a_1+d_1)=0，故 kA\in W_1。

      综上，W_1 是 V 的子空间。

  - title: "(1) 验证 W_2 为子空间"
    content: |
      \textbf{非空性：} O\in W_2 显然。

      \textbf{加法封闭：} 设 \begin{pmatrix}a_1&0\\0&d_1\end{pmatrix},\begin{pmatrix}a_2&0\\0&d_2\end{pmatrix}\in W_2（其中 a_i+d_i=0），其和为 \begin{pmatrix}a_1+a_2&0\\0&d_1+d_2\end{pmatrix}，且 (a_1+a_2)+(d_1+d_2)=0，仍属 W_2。

      \textbf{数乘封闭：} 任取 k\in\mathbb{R}，k\begin{pmatrix}a&0\\0&d\end{pmatrix}=\begin{pmatrix}ka&0\\0&kd\end{pmatrix}，而 ka+kd=k(a+d)=0。故 W_2 是 V 的子空间。

  - title: "(2) 求 W_1 的基与维数"
    content: |
      W_1 中矩阵满足 d=-a，可写为：
      \begin{pmatrix}a&b\\c&-a\end{pmatrix}=a\begin{pmatrix}1&0\\0&-1\end{pmatrix}+b\begin{pmatrix}0&1\\0&0\end{pmatrix}+c\begin{pmatrix}0&0\\1&0\end{pmatrix}

      这三个矩阵 \begin{pmatrix}1&0\\0&-1\end{pmatrix},\begin{pmatrix}0&1\\0&0\end{pmatrix},\begin{pmatrix}0&0\\1&0\end{pmatrix} 线性无关（对应不同的位置），构成 W_1 的一组基，故 \dim(W_1)=3。

  - title: "(2) 求 W_2 的基与维数"
    content: |
      W_2 中矩阵满足 d=-a 且非对角元为 0：
      \begin{pmatrix}a&0\\0&-a\end{pmatrix}=a\begin{pmatrix}1&0\\0&-1\end{pmatrix}

      \left\{\begin{pmatrix}1&0\\0&-1\end{pmatrix}\right\} 构成 W_2 的一组基，故 \dim(W_2)=1。

  - title: "(3) W_1∩W_2 与 W_1+W_2"
    content: |
      W_1\cap W_2 中的矩阵必须满足：非对角元为 0（来自 W_2）且迹为 0（两者共有）。
      满足这两条的矩阵为 \begin{pmatrix}a&0\\0&-a\end{pmatrix}，即 W_1\cap W_2=W_2。故 \dim(W_1\cap W_2)=1。

      W_1+W_2=\{\,A+B\mid A\in W_1,\;B\in W_2\,\}。由于 W_2\subset W_1，从而 W_1+W_2=W_1。故 \dim(W_1+W_2)=3。

      验证维数公式：\dim(W_1+W_2)=3,\;\dim(W_1)+\dim(W_2)-\dim(W_1\cap W_2)=3+1-1=3\ \checkmark
